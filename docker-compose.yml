services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  migrate:
    build: .
    image: grading-service:latest
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    networks:
      - app_network
    restart: "no"

  backend:
    image: grading-service:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - app_network
    restart: unless-stopped

  worker:
    image: grading-service:latest
    command: arq app.workers.settings.WorkerSettings
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - app_network
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:

networks:
  app_network:
    driver: bridge